version: '3.8'

services:
  ollama:
    image: ollama/ollama:0.9.0
    ports:
      - "11434:11434"
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - ollama-data:/root/.ollama
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  mistral-7b-preload:
    image: curlimages/curl
    depends_on: [ ollama ]
    entrypoint: >
      sh -c "
        sleep 10 &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"mistral:7b\"}' &&
        sleep 2 &&
        curl -X POST http://ollama:11434/api/generate -d '{\"model\":\"mistral:7b\",\"prompt\":\"hello\",\"stream\":false}'
      "
    restart: "no"
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TZ=Asia/Kolkata
    volumes:
      - chroma-data:/root/.chromadb

volumes:
  ollama-data:
  chroma-data:
